

name: banking-storage

services:

  postgres:

    image: postgres:16

    container_name: banking-postgres

    restart: unless-stopped

    
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../docker/postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polaris"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - banking-network

volumes:

  postgres-data:

networks:

  banking-network:
    name: banking-network